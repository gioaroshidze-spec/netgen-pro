version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: netgen-pro-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ACTIVE_AI_MODEL=claude-opus-4-7
      - VNMS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    # Only map the directories and files that NEED to persist
    volumes:
      - ./backend/archive:/app/archive
      - ./backend/templates:/app/templates
      - ./backend/netgen.db:/app/netgen.db
      # NEW: Persistent Telemetry Logs
      - ./backend/backend_app.log:/app/backend_app.log
      - ./backend/ansible.log:/app/ansible.log

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: netgen-pro-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
