version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vnms-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ACTIVE_AI_MODEL=claude-opus-4-7
      - VNMS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    # Only map the directories that NEED to change dynamically
    volumes:
      - ./backend/archive:/app/archive
      - ./backend/host_vars:/app/host_vars
      - ./backend/group_vars:/app/group_vars
      - ./backend/templates:/app/templates
      - ./backend/inventory.ini:/app/inventory.ini
      - ./backend/netgen.db:/app/netgen.db

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vnms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend