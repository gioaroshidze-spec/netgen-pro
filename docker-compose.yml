services:
  netgen-pro-backend:
    image: gioaro/netgen-pro-backend:1.0
    container_name: netgen-pro-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      # Persistent local database: ensures customer variables, profiles, and device entries are never lost during code updates
      - ./client_data/netgen.db:/app/netgen.db
      - ./client_data/archive:/app/archive
      # Mount paths for dynamic generation playbooks and template blueprints
      - ./client_data/host_vars:/app/host_vars
      - ./client_data/group_vars:/app/group_vars
      - ./client_data/templates:/app/templates
      - ./client_data/inventory.ini:/app/inventory.ini

  netgen-pro-frontend:
    image: gioaro/netgen-pro-frontend:1.0
    container_name: netgen-pro-frontend
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:80"
    depends_on:
      - netgen-pro-backend